<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <div class="intro">
            <div class="badge"><i class="bi bi-cpu-fill"></i></div>
            <h1>Build Your<br>Own Calculator</h1>
        </div>

        <div class="container">
            <div class="top-bar">
                <button id="btn" class="mode-toggle" aria-label="Toggle dark mode">
                    <i class="bi bi-moon-fill"></i>
                </button>

                <button id="historyBtn" class="mode-toggle" aria-label="Show history">
                    <i class="bi bi-clock-fill"></i>
                </button>
            </div>

            <div class="history-panel" id="historyPanel"></div>

            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>

            <div class="buttons">
                <button class="operator" data-value="AC">AC</button>
                <button class="operator" data-value="DEL">DEL</button>
                <button class="operator" data-value="%">%</button>
                <button class="operator" data-value="/">/</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">*</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">-</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button data-value="0">0</button>
                <button data-value="00">00</button>
                <button class="operator" data-value=".">.</button>
                <button class="operator" data-value="=">=</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
